name: Production checks

on:
  push:
    branches: [main, production-hardening]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Check backend syntax
        working-directory: backend
        run: npm test
      - name: Smoke test health and readiness
        working-directory: backend
        env:
          NODE_ENV: test
          DATABASE_PATH: /tmp/freelance-ci.db
          CORS_ORIGIN: http://localhost:5173
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: test-password-123
        run: |
          node src/server.js > /tmp/backend.log 2>&1 &
          pid=$!
          trap "kill $pid" EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:3001/ready; then
              echo
              curl -fsS http://127.0.0.1:3001/health
              exit 0
            fi
            sleep 1
          done
          cat /tmp/backend.log
          exit 1
